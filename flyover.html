<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AASAAR — 14.5s 3D Flyover Film</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0e11;
      color: #ffffff;
      font-family: 'Epilogue', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      overflow-x: hidden;
    }
    .header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #fff;
      font-weight: 700;
      letter-spacing: 0.12em;
      font-size: 15px;
    }
    .back-btn {
      color: #9a9a9a;
      text-decoration: none;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }
    .back-btn:hover { color: #fff; }
    .theater {
      position: relative;
      width: 100%;
      max-width: 1200px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
      background: #000;
      aspect-ratio: 1440 / 1152;
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }
    .meta {
      width: 100%;
      max-width: 1200px;
      margin-top: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .meta-title {
      font-size: 18px;
      font-weight: 500;
    }
    .meta-sub {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      color: #8b8b92;
      font-size: 20px;
      margin-left: 8px;
    }
    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      color: #b0b3b8;
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="index.html" class="brand">
      <span>AASAAR</span>
    </a>
    <a href="index.html" class="back-btn">
      ← Back to Website
    </a>
  </div>

  <div class="theater">
    <video src="flyover.mp4" controls autoplay playsinline loop></video>
  </div>

  <div class="meta">
    <div>
      <span class="meta-title">The ayah is the premise.</span>
      <span class="meta-sub">where research begins.</span>
    </div>
    <div class="chips">
      <span class="chip">14.5s 3D Flyover</span>
      <span class="chip">1440 × 1152</span>
      <span class="chip">60 FPS</span>
      <span class="chip">32 Popping Layers</span>
      <span class="chip">WebGL2 Studio</span>
    </div>
  </div>
</body>
</html>
